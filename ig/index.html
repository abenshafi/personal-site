<!doctype html>
<html><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shafiz.net</title>
<noscript><meta http-equiv="refresh" content="0;url=/"></noscript>
<style>html,body{margin:0;background:#f6f1e7}@media(prefers-color-scheme:dark){html,body{background:#12160f}}</style>
<script>
(function(){
  var dest = "/";
  var done = false;
  function go(){ if (done) return; done = true; location.replace(dest); }
  try {
    var img = new Image();
    img.referrerPolicy = 'no-referrer';
    img.onload = img.onerror = go;
    img.src = 'https://hits.sh/shafiz.net/src-instagram.svg';
  } catch (e) { go(); }
  setTimeout(go, 600);
})();
</script>
</head><body></body></html>
